const colors=['#ffcf4c','#62b8ff','#eaa8ff','#6fe2b8','#ff986f','#d7d8ff'];
const e=s=>String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const dollars=n=>(n<0?'−$'+Math.abs(n).toLocaleString():'$'+n.toLocaleString());
const createDefault=()=>({teams:[{name:'Team 1',score:0},{name:'Team 2',score:0},{name:'Team 3',score:0},{name:'Team 4',score:0}],played:[],attempted:[],modal:null,stage:null,active:null,wagerTeam:0,wager:100,finalWagers:[],finalResults:{},finalStarted:false,finalDone:false,finalPhase:null});
let state=createDefault(),undoStack=[];
try{let stored=JSON.parse(localStorage.getItem(KEY));if(stored?.teams&&Array.isArray(stored.played))state={...createDefault(),...stored,modal:null,stage:null,active:null,attempted:[]};}catch(err){}
let timerRunning=false, timeLeft=20000, timerTick=0, timerAnchor=0, soundOn=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...state,modal:null,stage:null,active:null,attempted:[]}));}catch(err){}};
const checkpoint=()=>{undoStack.push(JSON.stringify(state));if(undoStack.length>50)undoStack.shift();};
const $=s=>document.querySelector(s);
function display(){
  const count=state.played.length;
  const rank=state.teams.map((t,i)=>({i,score:t.score})).sort((a,b)=>b.score-a.score);
  $('#app').innerHTML=`<header class="top">
    <div class="identity"><div class="mark" aria-label="FIU logo-inspired letters">FIU</div><div><div class="eyebrow">Student Government Association · 2026</div><h1 class="headline">PANTHER <span>JEOPARDY</span></h1></div></div>
    <nav class="actions" aria-label="Host controls"><button class="btn" data-action="rules">How to play</button><button class="btn" data-action="setup">Teams</button><button class="btn" data-action="undo" ${!undoStack.length?'disabled':''}>↶ Undo</button><button class="btn" data-action="sound">${soundOn?'Sound ON':'Sound OFF'}</button><button class="btn" data-action="fullscreen">⛶ Full screen</button><button class="btn gold" data-action="final">FINAL JEOPARDY</button><button class="btn flat" data-action="reset">Reset</button></nav>
    </header>
    <section class="scorebar" aria-label="Scoreboard" style="grid-template-columns:repeat(${state.teams.length},minmax(0,1fr))">${state.teams.map((t,i)=>`<div class="team" style="--tc:${colors[i%colors.length]}"><div class="team-head"><div class="team-name">${e(t.name)}</div><div class="team-pos">${t.score===rank[0].score?'LEADING':'TEAM '+(i+1)}</div></div><div class="score">${dollars(t.score)}</div></div>`).join('')}</section>
    <main class="board-wrap"><div class="board" aria-label="Jeopardy board">${categories.map(cat=>`<div class="col"><div class="category"><div class="cat-label">${e(cat.name)}</div><div class="cat-sub">${e(cat.subtitle)}</div></div>${[100,200,300,400,500].map(value=>{let key=cat.id+'-'+value;let used=state.played.includes(key);return `<button type="button" class="tile ${used?'used':''}" data-action="tile" data-key="${key}" ${used?'disabled':''} aria-label="${e(cat.name)} for ${value} points${used?', already played':''}"><span>$${value}</span></button>`}).join('')}</div>`).join('')}</div></main>
    <footer class="bottombar"><div class="info"><b>HOW TO PLAY:</b> Choose a category and point value. Reveal the answer after teams respond. The host awards or deducts points.</div><div class="stat">${count}/30 CLUES PLAYED</div></footer>`;
  showOverlay();
  save();
}
function showOverlay(){
  const node=$('#layer');
  if(!state.modal){node.innerHTML='';return;}
  let content='';
  if(state.modal==='rules')content=rulesTemplate();
  if(state.modal==='setup')content=setupTemplate();
  if(state.modal==='question')content=questionTemplate();
  if(state.modal==='final')content=finalTemplate();
  node.innerHTML=`<div class="overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-label="${state.modal==='question'?'Jeopardy clue':e(state.modal)}"><div class="mheader"><span class="micro">${state.modal==='question'?'FIU x SGA · LIVE ROUND':state.modal==='final'?'CHAMPIONSHIP ROUND':'HOST CONTROL CENTER'}</span><button class="x" data-action="close" aria-label="Close dialog">×</button></div>${content}</section></div>`;
  updateTimerVisual();
}
function rulesTemplate(){return `<div class="big-tag">THE RULES</div><div class="stage-title">Ready to play?</div><div class="rules-grid"><div class="rule"><h3>1 · Pick a clue</h3><p>Divide into 2–6 teams. Teams take turns selecting a category and $100–$500 clue. All teams may buzz in verbally.</p></div><div class="rule"><h3>2 · Reveal and score</h3><p>Read the clue. After a response, press “Show Answer.” Correct earns the clue value; wrong deducts it. After a miss, another team can steal.</p></div><div class="rule"><h3>3 · Daily Doubles</h3><p>Two surprise Daily Doubles are hidden on the board. Only the selecting team answers and wagers up to its score or $500, whichever is greater.</p></div><div class="rule"><h3>4 · Final Jeopardy</h3><p>Teams secretly choose a wager, the host reads the final clue, and then reveals the answer. Award or deduct each wager; highest score wins.</p></div></div><p class="helper" style="text-align:center">Tip: The optional 20-second timer starts only when the host presses “Start timer.” Answers and official FIU source links appear after reveal.</p><div class="modal-controls"><button class="btn gold" data-action="close">Let's play</button></div>`}
function setupTemplate(){return `<div class="big-tag">CUSTOMIZE TEAMS</div><div class="stage-title" style="margin:14px auto 19px">Who's competing?</div><div class="setup-grid">${state.teams.map((t,i)=>`<div><label for="team-${i}">Team ${i+1}</label><input id="team-${i}" class="setup-input" maxlength="28" value="${e(t.name)}" /></div>`).join('')}</div><div class="setup-row"><button class="btn" data-action="team-add" ${state.teams.length>=6?'disabled':''}>+ Add team</button><button class="btn" data-action="team-remove" ${state.teams.length<=2?'disabled':''}>− Remove last team</button><button class="btn gold" data-action="team-save">Save team names</button></div><p class="secondary">Choose 2–6 teams. Scores remain when you rename or add teams.</p>`}
function timerWidget(){return `<div class="timer-wrap"><span class="clock" id="clock">${Math.ceil(timeLeft/1000)}s</span><div class="meter"><div id="meter-bar"></div></div><button class="btn timerbtn" data-action="timer">${timerRunning?'Pause':'Start'} timer</button></div>`}
function questionTemplate(){
  const q=clues.find(q=>q.key===state.active);
  if(!q)return `<p>Clue not found.</p>`;
  if(state.stage==='wager'){
    let cap=Math.max(500,state.teams[state.wagerTeam]?.score||0);
    return `<div class="big-tag">★ DAILY DOUBLE ★</div><h2 class="stage-title">${e(q.category)} · $${q.value}</h2><p class="wager-sub">The selecting team gets one answer. Choose a wager before revealing the clue.</p><div class="pick-teams">${state.teams.map((t,i)=>`<button class="pick-team ${i===state.wagerTeam?'active':''}" data-action="pick-wager-team" data-team="${i}">${e(t.name)} · ${dollars(t.score)}</button>`).join('')}</div><div class="wager-row"><label for="wager">Wager ($)</label><input type="number" class="wager-input" id="wager" min="100" max="${cap}" step="100" value="${Math.min(state.wager,cap)}"/><span class="helper">Max: ${dollars(cap)}</span></div><div class="warning" id="wager-warning"></div><div class="modal-controls"><button class="btn gold" data-action="wager-lock">Lock wager & see clue</button></div>`;
  }
  const value=q.dailyDouble?state.wager:q.value;
  const top=q.dailyDouble?`DAILY DOUBLE · ${e(state.teams[state.wagerTeam].name)} WAGERS ${dollars(state.wager)}`:`${e(q.category)} · ${dollars(q.value)}`;
  let body=`<div class="big-tag">${top}</div><h2 class="stage-title">${e(q.clue)}</h2>`;
  if(state.stage==='clue')return body+timerWidget()+`<div class="modal-controls"><button class="btn gold" data-action="reveal">Show Answer</button><button class="btn" data-action="close">Back to board</button></div><p class="secondary">Host: read aloud, then reveal. Answers are hidden from players until you click.</p>`;
  const rows=state.teams.map((t,i)=>{let locked=state.attempted.includes(i)||q.dailyDouble&&state.wagerTeam!==i;return `<div class="score-choice ${locked?'done':''}"><div class="nm">${e(t.name)}</div><div class="buttons"><button class="btn green" data-action="correct" data-team="${i}" ${locked?'disabled':''}>✓ +${dollars(value)}</button><button class="btn red" data-action="wrong" data-team="${i}" ${locked?'disabled':''}>✕ −${dollars(value)}</button></div></div>`}).join('');
  return body+`<div class="answer-card"><div class="answer-label">CORRECT RESPONSE</div><div class="answer-text">${e(q.answer)}</div><div class="fun-fact">${e(q.fact)}</div><p class="source"><a href="${e(q.source)}" target="_blank" rel="noopener noreferrer">Verify with FIU's official source ↗</a></p></div><div class="scoring">${rows}</div><div class="modal-controls"><button class="btn" data-action="no-points">Nobody got it · close clue</button></div><p class="secondary">Incorrect answers deduct points; for a regular clue, another team may steal.</p>`;
}
function finalTemplate(){
 const f=finalClue;
 if(state.stage==='final-wagers')return `<div class="big-tag">FINAL JEOPARDY</div><h2 class="stage-title">One last chance to win it all.</h2><p class="wager-sub">Each team enters its wager. Teams with scores of $0 or below cannot wager.</p><div class="final-wagers">${state.teams.map((t,i)=>{let limit=Math.max(0,t.score);return `<div class="fwager"><label for="fw-${i}">${e(t.name)} · ${dollars(t.score)}</label><input type="number" id="fw-${i}" min="0" max="${limit}" step="100" value="${Math.min(state.finalWagers[i]||0,limit)}" ${limit<=0?'disabled':''}/><small>Maximum ${dollars(limit)}</small></div>`}).join('')}</div><div id="final-warning" class="warning"></div><div class="modal-controls"><button class="btn gold" data-action="final-lock">Lock wagers and show clue</button></div>`;
 const clueText=`<div class="big-tag">FINAL JEOPARDY · FIU HISTORY</div><h2 class="stage-title">${e(f.clue)}</h2>`;
 if(state.stage==='final-clue')return clueText+timerWidget()+`<div class="modal-controls"><button class="btn gold" data-action="final-reveal">Reveal final answer</button></div>`;
 const answer=`<div class="answer-card"><div class="answer-label">FINAL RESPONSE</div><div class="answer-text">${e(f.answer)}</div><div class="fun-fact">${e(f.fact)}</div><p class="source"><a href="${e(f.source)}" target="_blank" rel="noopener noreferrer">Official FIU source ↗</a></p></div>`;
 const res=`<div class="final-scores">${state.teams.map((t,i)=>{let r=state.finalResults[i];return `<div class="final-score"><div><b>${e(t.name)}</b><div style="color:#b9c9e4;font-size:12px">Wager ${dollars(state.finalWagers[i]||0)} · Score ${dollars(t.score)}</div></div><div>${r?`<span style="color:${r==='correct'?'#8ee7b8':'#ffacb6'};font-weight:850">${r==='correct'?'✓ CORRECT':'✕ WRONG'}</span>`:(state.finalWagers[i]||0)===0?'<span style="color:#a5b4d5;font-weight:800">NO WAGER</span>':`<button class="btn green" data-action="final-correct" data-team="${i}">✓</button> <button class="btn red" data-action="final-wrong" data-team="${i}">✕</button>`}</div></div>`}).join('')}</div>`;
 if(state.stage==='final-result'){
   let best=Math.max(...state.teams.map(t=>t.score));let winners=state.teams.filter(t=>t.score===best).map(t=>t.name).join(' & ');
   return `<div class="big-tag">YOUR CHAMPIONS</div><div class="winner">${e(winners)}!</div><p class="wager-sub">Winning score: ${dollars(best)}</p>`+res+`<div class="modal-controls"><button class="btn gold" data-action="close">Return to board</button></div>`;
 }
 return clueText+answer+res+`<div id="final-warning" class="warning"></div><div class="modal-controls"><button class="btn gold" data-action="final-finish">Reveal winner</button></div><p class="secondary">Mark every team that placed a wager. Teams with $0 wagers stay unchanged.</p>`;
}
function beep(){if(!soundOn)return;try{const a=new (window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=590;g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.11,a.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.25);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.26);setTimeout(()=>a.close(),450)}catch(err){}}
function timerStop(){timerRunning=false;updateTimerVisual();}
function timerReset(final=false){timerStop();timeLeft=final?30000:20000;updateTimerVisual();}
function updateTimerVisual(){let c=$('#clock'),b=$('#meter-bar'),bt=$('[data-action="timer"]');if(c)c.textContent=Math.ceil(timeLeft/1000)+'s';if(b){let denom=state.modal==='final'?30000:20000;b.style.width=Math.min(100,100*timeLeft/denom)+'%';b.style.background=timeLeft<=5000?'#ff7b87':'linear-gradient(90deg,#f1ac28,#ffe08c)';}if(bt)bt.textContent=timerRunning?'Pause timer':'Start timer';}
setInterval(()=>{if(!timerRunning)return;let now=Date.now();timeLeft=Math.max(0,timeLeft-(now-timerAnchor));timerAnchor=now;updateTimerVisual();if(timeLeft<=0){timerStop();beep();}},100);
function openClue(key){const q=clues.find(x=>x.key===key);if(!q||state.played.includes(key))return;state.modal='question';state.active=key;state.attempted=[];state.wagerTeam=0;state.wager=100;state.stage=q.dailyDouble?'wager':'clue';timerReset();display();}
function markPlayed(){if(!state.played.includes(state.active))state.played.push(state.active);state.modal=null;state.stage=null;state.active=null;state.attempted=[];timerStop();display();}
function scoreAnswer(team,correct){const q=clues.find(x=>x.key===state.active);if(!q||state.stage!=='answer'||state.attempted.includes(team))return;if(q.dailyDouble&&team!==state.wagerTeam)return;checkpoint();const points=q.dailyDouble?state.wager:q.value;state.teams[team].score+=correct?points:-points;if(correct||q.dailyDouble){beep();markPlayed();}else{state.attempted.push(team);display();}}
function close(){timerStop();state.modal=null;state.stage=null;state.active=null;display();}
function err(id,msg){const elem=$(id);if(elem)elem.textContent=msg;}
function finalOpen(){timerStop();state.modal='final';state.stage=state.finalDone?'final-result':(state.finalPhase||'final-wagers');display();}
document.addEventListener('click',ev=>{
  const button=ev.target.closest('[data-action]');if(!button)return;
  const a=button.dataset.action;
  if(a==='tile')return openClue(button.dataset.key);
  if(a==='rules'){state.modal='rules';return display()}
  if(a==='setup'){state.modal='setup';return display()}
  if(a==='close')return close();
  if(a==='fullscreen'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();return}
  if(a==='sound'){soundOn=!soundOn;display();return}
  if(a==='undo'){if(!undoStack.length)return;timerStop();state=JSON.parse(undoStack.pop());display();return}
  if(a==='reset'){if(confirm('Reset the game, clear all scores, and replay all 30 clues?')){state=createDefault();undoStack=[];timerStop();display()}return}
  if(a==='team-add'){if(state.teams.length<6){const names=state.teams.map((t,i)=>$('#team-'+i)?.value||t.name);state.teams.forEach((t,i)=>t.name=names[i]);state.teams.push({name:'Team '+(state.teams.length+1),score:0});display()}return}
  if(a==='team-remove'){if(state.teams.length>2&&confirm('Remove the last team and its score?')){state.teams.pop();display()}return}
  if(a==='team-save'){state.teams.forEach((t,i)=>t.name=($('#team-'+i)?.value||('Team '+(i+1))).trim().slice(0,28));close();return}
  if(a==='pick-wager-team'){state.wagerTeam=Number(button.dataset.team);display();return}
  if(a==='wager-lock'){
    const max=Math.max(500,state.teams[state.wagerTeam].score);const wager=Number($('#wager').value);
    if(!Number.isInteger(wager)||wager<100||wager>max||wager%100!==0){err('#wager-warning','Enter a wager in $100 increments, from $100 to '+dollars(max)+'.');return;}
    state.wager=wager;state.stage='clue';timerReset();display();return;
  }
  if(a==='timer'){if(timerRunning){timerStop();}else if(timeLeft>0){timerAnchor=Date.now();timerRunning=true;updateTimerVisual();}return}
  if(a==='reveal'){timerStop();state.stage='answer';display();return}
  if(a==='correct'||a==='wrong'){scoreAnswer(Number(button.dataset.team),a==='correct');return}
  if(a==='no-points'){checkpoint();markPlayed();return}
  if(a==='final'){finalOpen();return}
  if(a==='final-lock'){
    const wagers=[];
    for(let i=0;i<state.teams.length;i++){let amount=Number($('#fw-'+i)?.value||0);let max=Math.max(0,state.teams[i].score);if(!Number.isInteger(amount)||amount<0||amount>max){err('#final-warning','Team '+(i+1)+' must wager between $0 and '+dollars(max)+'.');return;}wagers.push(amount)}
    state.finalWagers=wagers;state.finalStarted=true;state.stage='final-clue';state.finalPhase='final-clue';timerReset(true);display();return;
  }
  if(a==='final-reveal'){timerStop();state.stage='final-answer';state.finalPhase='final-answer';display();return}
  if(a==='final-correct'||a==='final-wrong'){
    let i=Number(button.dataset.team);if(state.finalResults[i])return;checkpoint();let correct=a==='final-correct';state.teams[i].score+=(correct?1:-1)*(state.finalWagers[i]||0);state.finalResults[i]=correct?'correct':'wrong';display();return;
  }
  if(a==='final-finish'){if(state.teams.some((t,i)=>state.finalWagers[i]>0&&!state.finalResults[i])){err('#final-warning','Score all teams with a positive wager before revealing the winner.');return;}checkpoint();state.finalDone=true;state.stage='final-result';state.finalPhase='final-result';beep();display();return}
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'&&state.modal){close();return}
 if((ev.key===' '||ev.key==='Spacebar')&&state.modal&&['clue','final-clue'].includes(state.stage)&&!['INPUT','BUTTON'].includes(document.activeElement?.tagName)){ev.preventDefault();$('[data-action="timer"]')?.click();}
 if(ev.key.toLowerCase()==='r'&&state.modal==='question'&&state.stage==='clue'&&!['INPUT','BUTTON'].includes(document.activeElement?.tagName)){$('[data-action="reveal"]')?.click();}
});
display();
</script>
</body>
</html>
